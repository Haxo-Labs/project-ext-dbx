name: DBX Crates Tests

on:
  push:
    branches: [master, main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/crates-tests.yml
      - scripts/test-with-server.sh
  pull_request:
    branches: [master, main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/crates-tests.yml
      - scripts/test-with-server.sh

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-test:
    name: DBX Crates Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust: [stable]
        backend: [redis]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.backend }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.backend }}-
            ${{ runner.os }}-cargo-${{ matrix.rust }}-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: Build all crates
        run: cargo build --workspace --all-targets

      - name: Set up test environment
        run: |
          # Create test environment configuration
          cat > .env << EOF
          DBX_BACKEND_1_NAME=test_backend
          DBX_BACKEND_1_PROVIDER=redis
          DBX_BACKEND_1_URL=redis://localhost:6379
          DBX_DEFAULT_BACKEND=test_backend
          JWT_SECRET=test-jwt-secret-that-is-at-least-32-characters-long-for-security
          CREATE_DEFAULT_ADMIN=true
          DEFAULT_ADMIN_USERNAME=testadmin
          DEFAULT_ADMIN_PASSWORD=testpassword123
          HOST=0.0.0.0
          PORT=3000
          LOG_LEVEL=INFO
          EOF

      - name: Run core crate tests
        run: |
          cd crates/dbx-core
          cargo test --lib

      - name: Run config crate tests
        run: |
          cd crates/dbx-config
          cargo test --lib

      - name: Run router crate tests
        run: |
          cd crates/dbx-router
          cargo test --lib

      - name: Run adapter crate tests
        run: |
          cd crates/adapter
          cargo test --lib

      - name: Run API crate unit tests
        run: |
          cd crates/dbx-api
          cargo test --lib

      - name: Run integration tests
        run: |
          cd crates/dbx-api
          cargo test --test integration_tests
        env:
          DBX_BACKEND_1_URL: redis://localhost:6379
